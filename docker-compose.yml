version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crystal}
      POSTGRES_USER: ${POSTGRES_USER:-crystal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crystal_user} -d ${POSTGRES_DB:-crystal}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      # Maps the host path (${DATA_ROOT}/db-data) to the container path
      - ${DATA_ROOT}/db-data:/var/lib/postgresql/data:rw

  backend:
    # ⚠️ Use the tagged GHCR image instead of 'build'
    image: ghcr.io/samerberjawi/crystal:backend-latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # No published port: the frontend (nginx) reaches the API over the internal network.
    environment:
      NODE_ENV: production
      # Set to false once everyone who needs an account has one.
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (e.g. export JWT_SECRET=$(openssl rand -hex 32))}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-crystal_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DATABASE_NAME: ${POSTGRES_DB:-crystal}
      # Enable Banking. The callback URL must match one registered in the Enable Banking control panel exactly; when it
      # is empty the server builds it from the address you opened Crystal at, which is rarely the registered one.
      ENABLE_BANKING_REDIRECT_URL: ${ENABLE_BANKING_REDIRECT_URL:-}
      # Ask Crystal's built-in engine (the `ollama` service below). Only used once that service is running.
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      # Let someone point Ask Crystal at a model server on your own network. Always allowed when you are the only
      # user; set this to true if other people share the server and you still want it.
      ASSISTANT_ALLOW_PRIVATE_URLS: ${ASSISTANT_ALLOW_PRIVATE_URLS:-false}
    volumes:
      # If your backend needs persistent storage for logs, configuration, etc.
      # Create an empty directory inside the container if it's not needed, e.g., /app/config
      - ${DATA_ROOT}/backend-config:/app/config:rw 

  # Optional: the language-model engine behind Ask Crystal, so no separate setup is needed. It is left out unless asked
  # for. Start it with:  docker compose --profile ai up -d
  # Then choose and download a model under Settings, Connections, Ask Crystal. Models are several GB each and need
  # that much free memory (more is faster); they are kept under ${DATA_ROOT}/ollama. Not published on any port.
  # For an NVIDIA GPU, install the NVIDIA Container Toolkit and add to this service:
  #   deploy: { resources: { reservations: { devices: [ { driver: nvidia, count: all, capabilities: [gpu] } ] } } }
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    volumes:
      - ${DATA_ROOT}/ollama:/root/.ollama:rw

  frontend:
    # ⚠️ Use the tagged GHCR image instead of 'build'
    image: ghcr.io/samerberjawi/crystal:frontend-latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-7157}:80"
    # No volumes defined for frontend unless it serves static files/needs config
