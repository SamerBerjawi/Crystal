  <script>
    // Apply theme from localStorage on initial load to prevent flashing
    try {
      const storedTheme = localStorage.getItem('theme');
      const prefersDark = typeof window.matchMedia === 'function' && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const shouldUseLight =
        storedTheme === 'light' ||
        (storedTheme === 'system' && !prefersDark) ||
        (!storedTheme && !prefersDark);

      document.documentElement.classList.toggle('dark', !shouldUseLight);

      // Sync RGB primary variable
      const syncPrimaryRgb = () => {
        const color = getComputedStyle(document.documentElement).getPropertyValue('--primary-500').trim();
        if (color) {
          // Very simple hex to rgb
          const hex = color.replace('#', '');
          if (hex.length === 6) {
            const r = parseInt(hex.substring(0, 2), 16);
            const g = parseInt(hex.substring(2, 4), 16);
            const b = parseInt(hex.substring(4, 6), 16);
            document.documentElement.style.setProperty('--primary-500-rgb', `${r}, ${g}, ${b}`);
          }
        }
      };

      // Use a MutatonObserver to watch for class changes (dark mode) OR style changes
      const observer = new MutationObserver(() => syncPrimaryRgb());
      observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class', 'style'] });
      setTimeout(syncPrimaryRgb, 100);

    } catch (error) {
      document.documentElement.classList.add('dark');
      console.warn('Unable to read theme preference from localStorage.', error);
    }
  </script>
