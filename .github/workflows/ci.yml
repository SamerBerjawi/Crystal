name: Crystal CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'refactor/**']
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Test & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            tests/e2e/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Install E2E dependencies (for TypeScript spec checks)
        run: npm --prefix tests/e2e ci

      - name: Run TypeScript & strict typecheck
        run: npm run lint

      - name: Run unit & server test suites
        run: npm test

      - name: Build frontend production bundle
        run: npm run build

      - name: Build backend server bundle
        run: npm --prefix server run build
